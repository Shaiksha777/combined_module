<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f8fafc; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 32px 28px; max-width: 560px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { margin: 8px 0; color: #334155; }
    .muted { color: #64748b; font-size: 14px; }
    a.btn { display: inline-block; margin-top: 16px; padding: 10px 16px; background: #4f46e5; color: #fff; border-radius: 8px; text-decoration: none; }
    a.btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you for your submission!</h1>
    <p>Your code has been evaluated against the test cases and recorded.</p>
    <p class="muted">You may close this window. If you need to retake or view results, please contact your coordinator.</p>
    <a class="btn" href="/index">Back to Home</a>
  </div>
</body>
</html>
